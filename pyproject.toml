[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-inference-performance"
version = "0.1.0"
description = "A small decoder-only transformer for inference and KV-cache experiments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.2"]

[project.scripts]
inference-bench = "inference_lab.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
