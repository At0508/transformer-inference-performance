name: Inference cost model checks

on:
  push:
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run cost and KV-cache checks
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Smoke benchmark on CPU
        run: PYTHONPATH=src python -m inference_lab.benchmark --device cpu --context-lengths 8 --output-tokens 4 --warmup 1 --repetitions 2 --max-sequence-length 32 --output results/ci.json
